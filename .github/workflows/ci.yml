name: Game CI
on:
  push:
    branches: [full-game-development]
  pull_request:
    branches: [full-game-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install chromium
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-veil-ui-visual-qa
          path: test-results/ui/
          if-no-files-found: ignore
          retention-days: 3
      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate
