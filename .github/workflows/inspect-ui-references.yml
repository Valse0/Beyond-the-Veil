name: Inspect Seven UI References

on:
  push:
    branches: [full-game-development]
    paths:
      - '.github/workflows/inspect-ui-references.yml'
      - 'beyond-the-veil-ui-design/*.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-game-development
      - name: Create readable previews and image metadata
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json, hashlib

          source = Path("beyond-the-veil-ui-design")
          output = Path("ui-reference-inspection")
          output.mkdir(exist_ok=True)
          names = [
              "01_main_menu.png",
              "02_hunter_selection.png",
              "03_region_selection.png",
              "04_run_preparation.png",
              "05_gameplay_hud.png",
              "06_level_up.png",
              "07_game_over.png",
          ]
          records = []
          previews = []
          for name in names:
              path = source / name
              if not path.is_file():
                  raise SystemExit(f"Missing required reference: {path}")
              with Image.open(path) as original:
                  original.load()
                  image = ImageOps.exif_transpose(original).convert("RGB")
                  size = image.size
                  preview = ImageOps.contain(image, (1600, 900), Image.Resampling.LANCZOS)
                  preview_path = output / (path.stem + ".jpg")
                  preview.save(preview_path, quality=88, optimize=True)
                  previews.append((name, preview.copy()))
                  records.append({
                      "file": name, "width": size[0], "height": size[1],
                      "mode": original.mode, "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "preview": preview_path.name
                  })

          cell_w, cell_h = 800, 500
          sheet = Image.new("RGB", (cell_w * 2, cell_h * 4), "#10141b")
          draw = ImageDraw.Draw(sheet)
          for index, (name, image) in enumerate(previews):
              col, row = index % 2, index // 2
              tile = ImageOps.contain(image, (cell_w - 24, cell_h - 58), Image.Resampling.LANCZOS)
              x = col * cell_w + (cell_w - tile.width) // 2
              y = row * cell_h + 8
              sheet.paste(tile, (x, y))
              draw.text((col * cell_w + 12, row * cell_h + cell_h - 38), name, fill="#f0dfc0")
          sheet.save(output / "all-seven-contact-sheet.jpg", quality=90, optimize=True)
          (output / "metadata.json").write_text(json.dumps(records, indent=2), encoding="utf-8")
          print(json.dumps(records, indent=2))
          PY
      - name: Upload seven original-derived previews
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-veil-seven-ui-reference-previews
          path: ui-reference-inspection/
          if-no-files-found: error
          retention-days: 7
