name: Prepare visual previews

on:
  push:
    branches:
      - full-game-development
    paths:
      - 'beyond-the-veil-ui-design/01_main_menu.png'
      - 'beyond-the-veil-ui-design/02_hunter_selection.png'
      - 'beyond-the-veil-ui-design/03_region_selection.png'
      - 'beyond-the-veil-ui-design/04_run_preparation.png'
      - 'beyond-the-veil-ui-design/05_gameplay_hud.png'
      - 'beyond-the-veil-ui-design/06_level_up.png'
      - 'beyond-the-veil-ui-design/07_game_over.png'
      - '.github/workflows/prepare-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: full-game-development

      - name: Create compressed previews and text chunks
        run: |
          python -m pip install Pillow

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64

          sources = [
              Path("beyond-the-veil-ui-design/01_main_menu.png"),
              Path("beyond-the-veil-ui-design/02_hunter_selection.png"),
              Path("beyond-the-veil-ui-design/03_region_selection.png"),
              Path("beyond-the-veil-ui-design/04_run_preparation.png"),
              Path("beyond-the-veil-ui-design/05_gameplay_hud.png"),
              Path("beyond-the-veil-ui-design/06_level_up.png"),
              Path("beyond-the-veil-ui-design/07_game_over.png"),
          ]

          root = Path("Visual/assistant-preview")
          chunk_size = 180000

          for source in sources:
              if not source.is_file():
                  raise FileNotFoundError(f"Missing source image: {source}")

              output = root / source.stem
              output.mkdir(parents=True, exist_ok=True)

              with Image.open(source) as original:
                  original_size = original.size
                  image = original.convert("RGB")
                  image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)

              preview = output / "preview.jpg"
              image.save(preview, "JPEG", quality=82, optimize=True)

              encoded = base64.b64encode(preview.read_bytes()).decode("ascii")

              for old in output.glob("part-*.txt"):
                  old.unlink()

              chunks = [
                  encoded[i:i + chunk_size]
                  for i in range(0, len(encoded), chunk_size)
              ]

              for index, chunk in enumerate(chunks):
                  (output / f"part-{index:03d}.txt").write_text(chunk)

              (output / "manifest.txt").write_text(
                  f"source={source.as_posix()}\n"
                  f"original_width={original_size[0]}\n"
                  f"original_height={original_size[1]}\n"
                  f"format=jpeg\n"
                  f"width={image.width}\n"
                  f"height={image.height}\n"
                  f"chunks={len(chunks)}\n"
                  f"chunk_size={chunk_size}\n"
                  f"preview_bytes={preview.stat().st_size}\n"
              )

              print(
                  f"{source.name}: {image.width}x{image.height}, "
                  f"{preview.stat().st_size} bytes, {len(chunks)} chunk(s)"
              )
          PY

      - name: Commit preview files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Visual/assistant-preview/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: prepare seven UI design previews"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
