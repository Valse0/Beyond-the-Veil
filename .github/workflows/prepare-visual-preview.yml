name: Prepare visual preview

on:
  push:
    branches:
      - full-game-development
    paths:
      - 'Visual/IMG_9754.png'
      - '.github/workflows/prepare-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: full-game-development

      - name: Create compressed image preview
        run: |
          python -m pip install Pillow

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64

          source = Path("Visual/IMG_9754.png")
          output = Path("Visual/assistant-preview")
          output.mkdir(parents=True, exist_ok=True)

          image = Image.open(source).convert("RGB")
          image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)

          preview = output / "preview.jpg"
          image.save(preview, "JPEG", quality=82, optimize=True)

          encoded = base64.b64encode(preview.read_bytes()).decode("ascii")
          chunk_size = 6000

          for old in output.glob("part-*.txt"):
              old.unlink()

          chunks = [
              encoded[i:i + chunk_size]
              for i in range(0, len(encoded), chunk_size)
          ]

          for index, chunk in enumerate(chunks):
              (output / f"part-{index:03d}.txt").write_text(chunk)

          (output / "manifest.txt").write_text(
              f"format=jpeg\n"
              f"width={image.width}\n"
              f"height={image.height}\n"
              f"chunks={len(chunks)}\n"
              f"chunk_size={chunk_size}\n"
          )

          print(f"Created {len(chunks)} image chunks.")
          PY

      - name: Commit preview files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Visual/assistant-preview/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: prepare visual preview for inspection"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
